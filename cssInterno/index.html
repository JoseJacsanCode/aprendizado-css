<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS Interno</title>
    <style>
        body {
            background-color: #f0f0f0;
            /* Define a cor de fundo do corpo do documento */
        }

        h1 {
             /* Define a cor do texto para o título */
            color: darkblue;

            /* Centraliza o texto do título */
            text-align: center;
        }

        p {
            /* Define a cor do texto para os parágrafos */
            color: darkgreen;

            /* Define o tamanho da fonte para os parágrafos */
            font-size: 16px;
        }

    </style>
</head>

<body>
    <h1>Olá Mundo</h1>
    <p>
        Este é um exemplo de CSS interno. Os estilos são definidos dentro da tag "style" no cabeçalho da página.
    </p>
    <p>
        O CSS interno é prático para estilizações rápidas e específicas de uma página, mas não é recomendado para projetos maiores ou que requerem reutilização de estilos.
    </p>
</body>

</html>
