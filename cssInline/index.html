<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS Inline</title>
</head>

<body>
    <h1 style="color: navy; font-size: 24px;">Título com estilo inline</h1>
    <p style="color: green; font-weight: bold;">Este parágrafo é estilizado diretamente no elemento</p>
    <div style="padding: 20px; border: 1px solid black;">
        Essa div possui um padding e uma borda definidos inline
    </div>

</body>

</html>
